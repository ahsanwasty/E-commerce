<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELORA | Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><nav class="navbar navbar-expand-lg"><div class="container">
  <a class="navbar-brand fw-bold" href="index.html">Velora<span></span></a>
  <div class="nav-links"><a href="index.html">Home</a><a href="products.html">Products</a><a href="product-detail.html">Product-detail</a><a class="active" href="signup.html">Signup</a><a href="login.html">Login</a></div>
  <div class="nav-actions"><a href="login.html">My Account</a><a href="products.html">Wishlist</a><a href="login.html">Login</a><button class="btn btn-dark btn-sm" onclick="cartAlert()">Add to cart</button></div>
</div></nav></header>

<main class="form-page"><div class="container"><div class="auth-card">
  <p class="eyebrow">CREATE ACCOUNT</p><h1>Sign up</h1><p class="muted">Create your VELORA account to continue.</p>
  <form onsubmit="signupAlert(event)">
    <div class="mb-3"><label>Full name</label><input type="text" class="form-control" required></div>
    <div class="mb-3"><label>Email</label><input type="email" class="form-control" required></div>
    <div class="mb-3"><label>Password</label><input type="password" class="form-control" required></div>
    <button class="btn btn-dark w-100 py-2" type="submit">Register</button>
  </form>
  <p class="auth-bottom">Already have an account? <a href="login.html">Login</a></p>
</div></div></main>

<footer class="footer"><div class="container"><div><a class="navbar-brand fw-bold text-white" href="index.html">Velora<span></span></a><p>Simple shopping for everyday life.</p></div><div class="footer-links"><a href="index.html">Home</a><a href="products.html">Products</a><a href="signup.html">Signup</a><a href="login.html">Login</a></div><div class="clock-box">Date & Time: <span id="liveDateTime"></span></div></div></footer>
<script src="js/script.js"></script>
</body>
</html>
